[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexstrike-ai"
version = "6.0.0"
description = "HexStrike AI MCP Agents - AI-Powered MCP Cybersecurity Automation Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0x4m4" }]
keywords = ["mcp", "security", "pentesting", "automation", "ai-agents"]

# Mirrors the actively-used dependencies in requirements.txt so that
# `pip install .` / `pip install -e .` installs everything the server and
# MCP client need, and exposes the console scripts below on PATH.
dependencies = [
    "flask>=2.3.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.0,<6.0.0",
    "fastmcp>=0.2.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "selenium>=4.15.0,<5.0.0",
    "webdriver-manager>=4.0.0,<5.0.0",
    "aiohttp>=3.8.0,<4.0.0",
    "mitmproxy>=9.0.0,<11.0.0",
    "pwntools>=4.10.0,<5.0.0",
    "angr>=9.2.0,<10.0.0",
    "bcrypt==4.0.1",
]

[project.urls]
Homepage = "https://github.com/0x4m4/hexstrike-ai"
Repository = "https://github.com/0x4m4/hexstrike-ai"

[project.scripts]
# `hexstrike_mcp` is the exact command name expected by the MCP registration
# snippet (`command -v hexstrike_mcp`); `hexstrike-mcp` is a conventional alias.
hexstrike_mcp = "hexstrike_mcp:main"
hexstrike-mcp = "hexstrike_mcp:main"
hexstrike-server = "hexstrike_launcher:run_server"

[tool.setuptools]
py-modules = ["hexstrike_mcp", "hexstrike_server", "hexstrike_launcher"]
